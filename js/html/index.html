<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Bootstrap CSS -->

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Custom Styles -->
  <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon" />

  <title>Endicott Baseball</title>

<body>
  <main>
    <!-- Header Section -->
    <header>
      <div>
        <a href="index.html"></a>
          <img src="images/Logo.jpg" alt="Endicott Gulls Logo" />
        </a>
        <button class="toggle-menu" id="toggle-menu" data-visible="false" aria-label="Toggle Navigation"></button>
        <div>
          <h1 class="h1-dark"style="color: navy;">Endicott Gulls Baseball</h1>
          <p class="p-dark"style="color: navy;">Your Site To Check Out The EC Gulls Baseball Team!</p> 
        </div>
      </div>

      <!-- Navigation -->

          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link active" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="roster.html">Roster</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="schedule.html">Schedule</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="teamleaders.html">Team Leaders</a>
            </li>

        </div>
      </nav>
    </header>

    <!-- Carousel -->
    <div id="demo" class="carousel slide" data-bs-ride="carousel">

      <div class="carousel-indicators">
        <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
        <button type="button" data-bs-target="#demo" data-bs-slide-to="1" aria-label="Slide 2"></button>
        <button type="button" data-bs-target="#demo" data-bs-slide-to="2" aria-label="Slide 3"></button>
      </div>

      <!-- Carousel Items -->
      <div id="demo" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <a href="roster.html">
          <img src="images/Meet the guys image.jpg" alt="Team Introduction" class="d-block w-100" />
          </a>
        </div>
        <div class="carousel-item">
          <a href="schedule.html">
          <img src="images/Schedule slide.jpg" alt="Team Schedule" class="d-block w-100" />
          </a>
        </div>
        <div class="carousel-item">
          <img src="images/teamleaders.jpg" alt="Team Stat Leaders" class="d-block w-100" />
        </div>

    <div>
      <button onclick="topFunction()" id="cornerBtn" title="Go to top">Return To Top</button>
    </div>

  <footer>
